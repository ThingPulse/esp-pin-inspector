<div class="pin-canvas" *ngIf="chip as c">
  <!-- Toolbar with zoom controls -->
  <div class="canvas-toolbar">
    <button class="toolbar-button" (click)="zoomIn()" title="Zoom In">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="3" x2="8" y2="13"/>
        <line x1="3" y1="8" x2="13" y2="8"/>
      </svg>
    </button>
    <button class="toolbar-button" (click)="zoomOut()" title="Zoom Out">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="8" x2="13" y2="8"/>
      </svg>
    </button>
    <button class="toolbar-button" (click)="resetZoom()" title="Reset Zoom & Focus">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="12" height="12" rx="1"/>
        <line x1="5" y1="8" x2="11" y2="8"/>
        <line x1="8" y1="5" x2="8" y2="11"/>
      </svg>
    </button>
  </div>
  <div class="image-wrap">
    <div 
      #svgContainer
      class="svg-container"
      (mousedown)="onContainerMouseDown($event)"
      (touchstart)="onTouchStart($event)"
      (touchmove)="onTouchMove($event)"
      (touchend)="onTouchEnd()"
    >
      <div class="transform-wrapper" [style.transform]="getTransform()" [style.transform-origin]="getTransformOrigin()">
        <!-- Grid background that moves with canvas -->
        <div class="grid-background grid-main" [style.opacity]="getMainGridOpacity()"></div>
        <div class="grid-background grid-sub" [style.opacity]="getSubGridOpacity()"></div>
        <ng-container *ngIf="isSvg; else rasterImage">
          <div class="svg-host" [innerHTML]="svgContent"></div>
        </ng-container>
        <ng-template #rasterImage>
          <img [src]="'assets/chips/' + c.chipId + '/' + c.image" [alt]="c.name" />
        </ng-template>
        <svg
          #overlay
          class="overlay"
          [attr.viewBox]="'0 0 ' + c.viewBox.width + ' ' + c.viewBox.height"
          [attr.preserveAspectRatio]="'xMidYMid meet'"
          (click)="onOverlayClick($event)"
        >
      <rect x="0" y="0" [attr.width]="c.viewBox.width" [attr.height]="c.viewBox.height" fill="transparent"></rect>
      <!-- Function badges for selected pin -->
      <ng-container *ngIf="getSelectedPin() as selectedPin">
        <g class="function-badge">
          <ng-container *ngFor="let func of selectedPin.functions; let i = index">
            <g>
              <rect
                [attr.x]="getBadgeX(selectedPin, i)"
                [attr.y]="getBadgeY(selectedPin, i)"
                [attr.width]="getBadgeWidth(func)"
                [attr.height]="20"
                [attr.fill]="getFunctionColor(func.kind)"
                rx="3"
                ry="3"
                opacity="0.9"
              ></rect>
              <text
                [attr.x]="getBadgeX(selectedPin, i) + getBadgeWidth(func) / 2"
                [attr.y]="getBadgeY(selectedPin, i) + 10"
                fill="white"
                font-size="11"
                font-weight="500"
                text-anchor="middle"
                dominant-baseline="middle"
                pointer-events="none"
              >{{ func.kind }}<tspan *ngIf="func.role" font-size="9"> ({{ func.role }})</tspan></text>
            </g>
          </ng-container>
        </g>
      </ng-container>
      <ng-container *ngFor="let p of c.pins">
        <ng-container *ngIf="getHitArea(p) as hit">
          <rect
            class="pin"
            [class.selected]="p.id === selectedPinId"
            [class.editing]="editorEnabled && editingPin?.id === p.id"
            [class.warning]="hasWarning(p)"
            [class.gnd]="isGndPin(p)"
            [class.power-3v3]="is3V3Pin(p)"
            [class.nc]="isNcPin(p)"
            [attr.x]="hit.x"
            [attr.y]="hit.y"
            [attr.width]="hit.width"
            [attr.height]="hit.height"
            [attr.opacity]="matchesFilter(p) ? 1 : 0.15"
            rx="4"
            ry="4"
            (click)="!editorEnabled && pinClick.emit(p)"
            (mousedown)="onPinMouseDown($event, p)"
          ></rect>
          <ng-container *ngIf="editorEnabled">
            <!-- Pin number and name label -->
            <text
              class="pin-label"
              [attr.x]="hit.x + hit.width / 2"
              [attr.y]="hit.y + hit.height / 2 - 6"
              [attr.opacity]="matchesFilter(p) ? 1 : 0.15"
              text-anchor="middle"
              dominant-baseline="middle"
              pointer-events="none"
            >{{ p.number }}: {{ p.name }}</text>
            <!-- Corner handles -->
            <rect
              class="resize-handle resize-nw"
              [attr.x]="hit.x - 4"
              [attr.y]="hit.y - 4"
              width="8"
              height="8"
              (mousedown)="onResizeHandleMouseDown($event, p, 'resize-nw')"
            ></rect>
            <rect
              class="resize-handle resize-ne"
              [attr.x]="hit.x + hit.width - 4"
              [attr.y]="hit.y - 4"
              width="8"
              height="8"
              (mousedown)="onResizeHandleMouseDown($event, p, 'resize-ne')"
            ></rect>
            <rect
              class="resize-handle resize-sw"
              [attr.x]="hit.x - 4"
              [attr.y]="hit.y + hit.height - 4"
              width="8"
              height="8"
              (mousedown)="onResizeHandleMouseDown($event, p, 'resize-sw')"
            ></rect>
            <rect
              class="resize-handle resize-se"
              [attr.x]="hit.x + hit.width - 4"
              [attr.y]="hit.y + hit.height - 4"
              width="8"
              height="8"
              (mousedown)="onResizeHandleMouseDown($event, p, 'resize-se')"
            ></rect>
            <!-- Edge handles -->
            <rect
              class="resize-handle resize-n"
              [attr.x]="hit.x + hit.width / 2 - 4"
              [attr.y]="hit.y - 4"
              width="8"
              height="8"
              (mousedown)="onResizeHandleMouseDown($event, p, 'resize-n')"
            ></rect>
            <rect
              class="resize-handle resize-s"
              [attr.x]="hit.x + hit.width / 2 - 4"
              [attr.y]="hit.y + hit.height - 4"
              width="8"
              height="8"
              (mousedown)="onResizeHandleMouseDown($event, p, 'resize-s')"
            ></rect>
            <rect
              class="resize-handle resize-w"
              [attr.x]="hit.x - 4"
              [attr.y]="hit.y + hit.height / 2 - 4"
              width="8"
              height="8"
              (mousedown)="onResizeHandleMouseDown($event, p, 'resize-w')"
            ></rect>
            <rect
              class="resize-handle resize-e"
              [attr.x]="hit.x + hit.width - 4"
              [attr.y]="hit.y + hit.height / 2 - 4"
              width="8"
              height="8"
              (mousedown)="onResizeHandleMouseDown($event, p, 'resize-e')"
            ></rect>
          </ng-container>
        </ng-container>
      </ng-container>
    </svg>
      </div>
    </div>
  </div>
</div>
