<div class="toolbar">
  <app-chip-picker
    [chips]="chips"
    [selectedId]="chip?.chipId || null"
    (select)="sel.setChipId($event); $event && (chip=null); $event && (selectedPin=null); $event && (router.navigate(['/chip', $event]))">
  </app-chip-picker>
  <app-function-filter></app-function-filter>
  <app-search-box></app-search-box>
  <button *ngIf="editorEnabled && chip" class="download-btn" (click)="downloadChipJson()" title="Download updated chip.json">
    💾 Download chip.json
  </button>
</div>

<div *ngIf="chip as c" class="chip-info">
  <div class="chip-info-item">
    <strong>Package:</strong> {{ c.package }}
  </div>
  <div class="chip-info-item" *ngIf="c.datasheetUrl">
    <strong>Datasheet:</strong>
    <a [href]="c.datasheetUrl" target="_blank" rel="noopener noreferrer" class="datasheet-link">
      View Datasheet
      <span class="external-icon">↗</span>
    </a>
  </div>
</div>

<div *ngIf="chip as c; else pick">
  <div class="layout">
    <div class="canvas">
      <app-pin-canvas [chip]="c" [selectedPinId]="selectedPin?.id || null" (pinClick)="onPinClick($event)" (pinUpdate)="onPinUpdate($event)"></app-pin-canvas>
    </div>
    <div class="details">
      <app-pin-details [pin]="selectedPin"></app-pin-details>
    </div>
  </div>
</div>

<ng-template #pick>
  <p>Select a chip to begin.</p>
  
</ng-template>
